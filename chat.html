<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Dating Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header .status {
            font-size: 12px;
            opacity: 0.8;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        .message.sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .message.received {
            background: #2d2d44;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        .input-area {
            padding: 15px;
            background: #16213e;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            background: #2d2d44;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-area button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .input-area button:hover {
            transform: scale(1.05);
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        .error {
            background: #ff4757;
            color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .typing {
            font-size: 12px;
            color: #888;
            padding: 5px 15px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬 Chat</h1>
        <span class="status" id="status">Connecting...</span>
    </div>
    <div class="messages" id="messages">
        <div class="loading">Loading messages...</div>
    </div>
    <div class="typing" id="typing"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const userId = tg.initDataUnsafe.user?.id;

        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');
        const typingEl = document.getElementById('typing');

        const API_BASE = window.location.origin;

        let lastMessageId = 0;
        let pollInterval = null;

        async function fetchMessages() {
            try {
                const response = await fetch(`${API_BASE}/api/messages?room=${roomId}&last_id=${lastMessageId}`);
                const data = await response.json();
                
                if (data.success) {
                    const loading = messagesDiv.querySelector('.loading');
                    if (loading) loading.remove();
                    
                    data.messages.forEach(msg => {
                        appendMessage(msg);
                        lastMessageId = Math.max(lastMessageId, msg.id);
                    });
                    
                    statusEl.textContent = 'Online';
                } else {
                    statusEl.textContent = 'Error';
                }
            } catch (error) {
                console.error('Error fetching messages:', error);
                statusEl.textContent = 'Offline';
            }
        }

        function appendMessage(msg) {
            const isMine = msg.sender_id === userId;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isMine ? 'sent' : 'received'}`;
            
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messageDiv.innerHTML = `
                ${escapeHtml(msg.text)}
                <div class="time">${time}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            sendBtn.disabled = true;
            messageInput.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        room: roomId,
                        sender_id: userId,
                        text: text
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    messageInput.value = '';
                    await fetchMessages();
                } else {
                    showError(data.error || 'Failed to send message');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                showError('Network error');
            } finally {
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        function showError(text) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = text;
            messagesDiv.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 3000);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial load
        if (roomId && userId) {
            fetchMessages();
            pollInterval = setInterval(fetchMessages, 2000);
        } else {
            messagesDiv.innerHTML = '<div class="error">Invalid room or user ID</div>';
            statusEl.textContent = 'Error';
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pollInterval) clearInterval(pollInterval);
        });
    </script>
</body>
</html>
